# Shifted mHC boundary (DSV4.1).  Without these entries configloader falls back
# to the NVIDIA spaces, which do not model C550's 64-wide warps.  The project
# kernel is the boundary's bottleneck (skinny GEMM: (N, hc*H) @ (hc*H, 24));
# the collapse/norm spaces keep the fat-CTA options that win on decode shapes.
mhc_shifted_project:
  - gen: true
    param_map:
      META: {BLOCK_M: bm, BLOCK_K: bk, BLOCK_N: bn}
      num_warps: w
      num_stages: s
    bm: [16, 32, 64, 128]
    bk: [64, 128]
    bn: [32]
    w: [4, 8]
    s: [1]
  # num_stages stays at 1 on purpose: the fused row-sum-of-squares reduction
  # shares the pipelined K loop with tl.dot, and the MetaX
  # ConvertTritonGPUToLLVM pass crashes at num_stages >= 2 (the same FlagTree
  # limitation that forces stage 1 on NVIDIA).

mhc_shifted_coeff:
  # Fixed single config: this is a tiny one-program-per-token Sinkhorn, and
  # the MetaX backend miscompiles some num_warps variants of its 4x4
  # reductions.  Tuning it has no measurable payoff, so avoid the risk.
  - META: {}
    num_warps: 4
    num_stages: 1

mhc_shifted_collapse:
  - gen: true
    param_map:
      META: {BLOCK_H: bh}
      num_warps: w
      num_stages: s
    bh: [256, 512, 1024, 2048, 4096]
    w: [2, 4, 8]
    s: [1]

mhc_shifted_norm:
  - gen: true
    param_map:
      META: {BLOCK_D: bd}
      num_warps: w
      num_stages: s
    bd: [256, 512, 1024, 2048, 4096]
    w: [2, 4, 8]
    s: [1]

# Single-pass RMSNorm used by the MetaX hc=4 path.  BLOCK_D is
# next_power_of_2(D) and is passed by the host, so only the warp count is
# tuned here.
mhc_shifted_norm_metax:
  - META: {}
    num_warps: 4
    num_stages: 1
  - META: {}
    num_warps: 8
    num_stages: 1

# MetaX-only fused post + collapse + sum-of-squares kernel.
mhc_shifted_post_collapse:
  - gen: true
    param_map:
      META: {BLOCK_H: bh}
      num_warps: w
      num_stages: s
    bh: [128, 256, 512, 1024, 2048, 4096, 8192]
    w: [4, 8]
    s: [1]

# Pure skinny GEMM for the MetaX project path.  The split-K partials are
# fully written by every config, so pipelining is safe here; the spaces stay
# under C550's 64 KB shared-memory and 512-thread per-CTA limits.
mhc_shifted_project_metax:
  - gen: true
    param_map:
      META: {BLOCK_M: bm, BLOCK_K: bk, BLOCK_N: bn}
      num_warps: w
      num_stages: s
    bm: [16, 32, 64, 128]
    bk: [64, 128]
    bn: [32]
    w: [4, 8]
    s: [1]
  - gen: true
    param_map:
      META: {BLOCK_M: bm, BLOCK_K: bk, BLOCK_N: bn}
      num_warps: w
      num_stages: s
    bm: [16, 32, 64]
    bk: [64, 128]
    bn: [32]
    w: [4, 8]
    s: [2]
  - gen: true
    param_map:
      META: {BLOCK_M: bm, BLOCK_K: bk, BLOCK_N: bn}
      num_warps: w
      num_stages: s
    bm: [16, 32]
    bk: [64, 128]
    bn: [32]
    w: [4, 8]
    s: [3]
